<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暁ノ刃｜エフェクト位置テスト v9</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#eee5d1;font-family:system-ui,'Yu Gothic',sans-serif}header{max-width:1180px;margin:auto;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:17px;margin:0;color:#e7c887}small{color:#aaa}button{background:#222c3a;border:1px solid #ac9162;color:#fff0d0;padding:10px 14px;border-radius:7px;font-weight:600;cursor:pointer}button:disabled{opacity:.4}button:focus-visible{outline:3px solid white}.stage{width:min(100vw,1180px);aspect-ratio:1672/941;margin:auto;position:relative;overflow:hidden;background:#171723}.stage img{width:100%;height:100%;display:block}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{max-width:1180px;margin:12px auto;display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}.notes{max-width:1180px;margin:10px auto;padding:0 14px 18px;color:#d3c9b6;font-size:13px;line-height:1.7}.legend{font-size:12px;color:#c6b8a0}#status{font-size:13px;color:#d8bb83}</style><link rel="stylesheet" href="effect-target-v9.css"></head><body><header><div><h1>暁ノ刃　｜　エフェクト座標テスト v9</h1><small>原本を変更せず、攻撃対象の位置へ効果を重ねる検証</small></div><div class="battle-toolbar"><span id="status" role="status" aria-live="polite">準備完了</span><button type="button" id="battleReturn">戻る</button></div></header><div class="stage"><img alt="保存済み戦闘画面の原本" src="../assets/battle-v9/stage.png"><canvas id="fx" width="1672" height="941"></canvas></div><div class="controls"><button data-kind="thunder">半蔵 → 信長：雷撃</button><button data-kind="slash">半蔵 → 信長：斬撃</button><button data-kind="fire">信長 → 半蔵：黒炎（仮）</button><button data-kind="heal">おふう → 半蔵：回復</button><button id="points">命中座標の表示：OFF</button></div><details class="notes"><summary>この演出テストについて</summary>これは<strong>Effekseerのサンプルに含まれる画像テクスチャ</strong>を使った2D合成テストです。<strong>Effekseerの .efkproj / .efkefc をそのまま再生したものではありません。</strong> 現段階では原本に文字とゲージが焼き込まれているため、UIの重複解消や人物レイヤーの精密化は別工程です。<br><span class="legend">信長：胸元／半蔵：胴体／数字：被弾者の上方に出現。位置は仮調整値です。</span></details><script>
const C=document.querySelector('#fx'),ctx=C.getContext('2d'),status=document.querySelector('#status');const images={};const urls={thunder:'../assets/battle-v9/thunder.png',fire:'../assets/battle-v9/fire.png',halo:'../assets/battle-v9/halo.png',particle:'../assets/battle-v9/particle.png'};for(const [k,u] of Object.entries(urls)){let im=new Image();im.src=u;images[k]=im}const targets={nobunaga:{x:1320,y:420},hanzo:{x:720,y:510}};let effect=null,showPoints=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function run(kind){const now=performance.now();effect={kind,start:now};status.textContent=kind==='heal'?'おふうの回復':kind==='fire'?'信長の黒炎':kind==='slash'?'虎徹の斬撃':'半蔵の雷忍術';}
function sprite(k,x,y,w,h,alpha=1,rotation=0){const im=images[k];if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rotation);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function frame(now){ctx.clearRect(0,0,C.width,C.height);if(showPoints){ctx.font='bold 23px sans-serif';for(const [k,p] of Object.entries(targets)){ctx.strokeStyle='#ffe28b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe28b';ctx.fillText(k,p.x+26,p.y-24)}}if(effect){const t=(now-effect.start)/1000;const kind=effect.kind;const hit=kind==='fire'||kind==='heal'?targets.hanzo:targets.nobunaga;const prep=.20,hitAt=.43;const flash=clamp((t-prep)/.2,0,1);if(t<1.55){if(kind==='thunder'){for(let i=0;i<5;i++){const p=(i+.4)*.21;sprite('thunder',hit.x+(i-2)*22,hit.y-80+Math.sin(t*22+i)*14,65,270,clamp(1-t/1.15,0,1),Math.sin(t*12+i)*.22)}sprite('halo',hit.x,hit.y,220,220,.45*flash)}else if(kind==='slash'){ctx.save();ctx.translate(hit.x,hit.y);ctx.rotate(-.6);ctx.strokeStyle='rgba(240,252,255,'+clamp(1-t/1.0,0,1)+')';ctx.lineWidth=18;ctx.shadowBlur=25;ctx.shadowColor='#c9e7ff';ctx.beginPath();ctx.moveTo(-145,-90);ctx.quadraticCurveTo(0,10,145,90);ctx.stroke();ctx.restore();sprite('particle',hit.x,hit.y,210,210,clamp(1-t,0,1))}else if(kind==='fire'){for(let i=0;i<6;i++){const dx=Math.sin(i*3+t*5)*55;const dy=(i%3)*28;sprite('fire',hit.x+dx,hit.y+dy-55-t*45,135,180,clamp(1-t/1.1,0,1),i*.2)} }else if(kind==='heal'){sprite('halo',hit.x,hit.y,220+t*60,220+t*60,clamp(1-t/1.25,0,1));for(let i=0;i<8;i++)sprite('particle',hit.x+Math.sin(i*2)*80,hit.y+75-(t*110+i*12)%220,40,40,clamp(1-t/1.5,0,1))}if(t>hitAt){const num=kind==='heal'?'+180':kind==='fire'?'248':kind==='slash'?'196':'312';ctx.save();ctx.font='bold 58px system-ui';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#141620';ctx.fillStyle=kind==='heal'?'#5aff9a':'#ffffff';ctx.globalAlpha=clamp((1.5-t)/.55,0,1);ctx.strokeText(num,hit.x,hit.y-110-(t-hitAt)*75);ctx.fillText(num,hit.x,hit.y-110-(t-hitAt)*75);ctx.restore()}}else{effect=null;status.textContent='準備完了'}}requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.kind)));document.querySelector('#points').onclick=e=>{showPoints=!showPoints;e.target.textContent='命中座標の表示：'+(showPoints?'ON':'OFF')};</script><script src="effect-target-v9-bridge.js"></script></body></html>
