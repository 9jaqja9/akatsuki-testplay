<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>暁ノ刃 戦術ノベル</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a11;color:#f4e8d6;font-family:'Yu Mincho','Hiragino Mincho ProN',serif}#app{width:min(100vw,1280px);margin:auto;min-height:100dvh;background:linear-gradient(#11121d,#05060a);display:flex;flex-direction:column;overflow:hidden}.stage{height:min(59vw,62dvh);min-height:250px;position:relative;overflow:hidden;background-image:url(../assets/battle-playable/stage.webp);background-size:100% 100%;background-position:center}.stage:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#080a13b5,transparent 28%);pointer-events:none}.title{position:absolute;right:2%;top:2%;font-size:clamp(16px,2.8vw,33px);font-weight:900;color:#fff;text-shadow:2px 3px 5px #000,0 0 13px #a20;z-index:3}.status{position:absolute;top:2%;left:2%;z-index:3;background:#0c0d1ddd;border:1px solid #9c83a8;padding:9px 13px;width:36%;font-size:clamp(10px,1.6vw,18px)}.bar{height:7px;background:#39334c;margin-top:8px;border-radius:8px;overflow:hidden}.fill{height:100%;width:20%;background:linear-gradient(90deg,#6a54bf,#d6bbff);transition:width .5s}.fx{position:absolute;z-index:4;pointer-events:none;inset:0;opacity:0}.fx.slash{background:linear-gradient(132deg,transparent 43%,#bdeaff 48%,#fff 50%,#3989ff 52%,transparent 57%);animation:flash .6s}.fx.fire{background:radial-gradient(circle at 75% 45%,#ff430099,transparent 55%);animation:flash .7s}.fx.mist{background:radial-gradient(circle at 43% 50%,#9dbaffaa,transparent 55%);animation:flash .7s}.fx.guard{background:radial-gradient(circle at 23% 65%,#ffdc7c99,transparent 43%);animation:flash .7s}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}.panel{display:grid;grid-template-columns:34% 1fr;gap:10px;padding:10px;flex:1;min-height:210px}.menu,.dialog{border:1px solid #77788d;background:linear-gradient(130deg,#111a28,#070a12);box-shadow:inset 0 0 15px #253346}.menu{padding:10px}.menuhead{font-size:clamp(11px,1.5vw,16px);margin-bottom:7px}.actions{display:grid;gap:5px}button{cursor:pointer;color:#f5eadb;background:linear-gradient(90deg,#1a2534,#11141d);border:1px solid #454c5a;border-radius:4px;text-align:left;padding:8px 12px;font-family:inherit;font-size:clamp(12px,1.8vw,18px)}button:hover,button:focus{outline:0;border-color:#67cfff;box-shadow:0 0 10px #29bfff88;background:#20384b}button:disabled{opacity:.35;cursor:default}.dialog{padding:14px 18px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-height:170px}.speaker{font-size:clamp(16px,2vw,23px);color:#e3c38b;font-weight:bold}.line{font-size:clamp(14px,1.9vw,21px);line-height:1.8;white-space:pre-line;min-height:66px}.hint{font-size:12px;color:#aaaebf;padding:0 13px 12px}.end{position:absolute;inset:0;z-index:8;background:#080912e8;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;gap:22px}.end strong{font-size:clamp(24px,4vw,46px);color:#d7b87d}.end button{text-align:center}@media(max-width:650px){.stage{height:55vw;min-height:205px}.panel{grid-template-columns:1fr;gap:7px;padding:7px}.menu{padding:7px}.actions{grid-template-columns:repeat(2,1fr)}button{padding:10px 7px}.dialog{padding:10px 13px;min-height:155px}.status{width:42%}.hint{padding-bottom:8px}}
</style><link rel="stylesheet" href="playable.css"></head><body><div id="app"><header class="battle-toolbar"><span>暁ノ刃 · 戦闘イベント</span><button type="button" id="battleReturn">戻る</button></header><div class="stage" id="stage"><div class="title">暁ノ刃 <small style="font-size:45%">戦術ノベル試作</small></div><div class="status">おふう　家康の魂を探る<div class="bar"><div class="fill" id="fill"></div></div><small id="progress">魂の気配を探索中</small></div><div class="fx" id="fx"></div><div class="end" id="end"><strong>戦闘イベント終了</strong><div>家康の魂を見極める時間を稼いだ。<br>続きは本編の分岐シナリオへ。</div><div class="end-actions"><button type="button" onclick="resetGame()">もう一度プレイ</button><button type="button" id="battleComplete">物語に戻る</button></div></div></div><div class="panel"><div class="menu"><div class="menuhead">行動を選択してください</div><div class="actions"><button onclick="act('attack')">⚔ 斬り込む</button><button onclick="act('ninja')">✦ 忍術を使う</button><button onclick="act('team')">♟ 仲間と連携</button><button onclick="act('guard')">⬡ おふうを守る</button></div></div><div class="dialog"><div class="speaker" id="speaker">半蔵</div><div class="line" id="line">「おふう、殿の魂は見つかりそうか！」<br>「俺たちが信長を引き受ける。術に集中しろ！」</div></div></div><div class="hint">コマンドを選ぶと戦闘演出と会話が進みます。信長のHPはありません。暁眼や返魂ノ舞の秘密はここでは明かしません。</div></div><script>
const battleTimers=new Set();
function battleLater(callback,delay){const id=setTimeout(()=>{battleTimers.delete(id);callback()},delay);battleTimers.add(id);return id;}
function clearBattleTimers(){for(const id of battleTimers)clearTimeout(id);battleTimers.clear();}
let turn=0, busy=false;const scenes={attack:[['半蔵','「貴様の好きにはさせん！」\n半蔵が踏み込み、刀の閃光が黒炎を裂く。','slash'],['信長','『その程度の刃で儂を止めるつもりか！』\n黒炎が半蔵の足元で爆ぜた。','fire']],ninja:[['雪姫','「朧鏡――！」\n白い霧が広がり、信長の視界を覆う。','mist'],['信長','『小細工を……！』\n信長が霧を振り払おうと腕を振る。','fire']],team:[['あやめ','「半蔵、今だよ！」\nあやめの風魔手裏剣が信長の退路を塞ぐ。','slash'],['半蔵','「合わせる！」\n二人の攻撃が黒炎を押し返した。','guard']],guard:[['おふう','「……まだいる。家康様の魂は、まだ消えていない！」','mist'],['半蔵','「聞いたな、信長。殿はまだ抗っておられる！」\n半蔵はおふうの前に立ち塞がった。','guard']]};
const milestones=[['あやめ','「おふう！ こっちは任せて、早く！」','guard'],['信長','『そこを退け！ 女の術を止めてくれる！』','fire'],['おふう','「……見えた。二つの魂の境目が……！」','mist'],['半蔵','「今だ！ おふうの術を守り抜くぞ！」','slash']];
function show(a){document.getElementById('speaker').textContent=a[0];document.getElementById('line').textContent=a[1];let f=document.getElementById('fx');f.className='fx';void f.offsetWidth;f.className='fx '+a[2];if(a[2]==='fire'){let s=document.getElementById('stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}}
function act(k){if(busy||turn>=8)return;busy=true;document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);const pair=scenes[k];show(pair[0]);battleLater(()=>{show(pair[1]);battleLater(()=>{turn++;let n=Math.min(100,Math.round(turn/8*100));document.getElementById('fill').style.width=n+'%';document.getElementById('progress').textContent=n<100?'魂の気配を探索中':'魂の境目を発見';if(turn%2===0){show(milestones[turn/2-1])}if(turn>=8){battleLater(()=>{document.getElementById('end').style.display='flex'},1800)}else{busy=false;document.querySelectorAll('.actions button').forEach(b=>b.disabled=false)}},850)},850)}
function resetGame(){clearBattleTimers();turn=0;busy=false;document.getElementById('end').style.display='none';document.getElementById('fill').style.width='0%';document.getElementById('progress').textContent='魂の気配を探索中';document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);show(['半蔵','「おふう、殿の魂は見つかりそうか！」\n「俺たちが信長を引き受ける。術に集中しろ！」','guard'])}
resetGame();
</script><script src="playable-bridge.js"></script></body></html>
